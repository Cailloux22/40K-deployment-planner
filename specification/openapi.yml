openapi: 3.0.3

# Contrat d'API du backend de synchronisation (RT_09).
#
# Portée : ce backend ne sert QUE ce que EX_05/EX_06 exigent comme dépendant
# du réseau — compte utilisateur (EX_06, RG_10, RG_50, RG_52, RG_53, RT_67) et
# synchronisation delta des listes et déploiements (RT_09, RT_10, RG_11,
# RG_54, RT_15, RG_51, RT_68). Le parsing d'import (RT_01), le référentiel de
# socles (RT_02) et le référentiel de plateaux (RT_12) sont des
# données/traitements embarqués côté client, générés hors-ligne au build : ils
# ne sont volontairement PAS exposés ici (cf. RT_02/RT_12 : "jamais par appel
# réseau à l'exécution de l'application"). Le serveur ne vérifie donc pas les
# identifiants de référentiel qu'il reçoit (RT_69) : il les stocke tels quels.
#
# Le blocage de l'import hors-ligne (RG_13/RT_14) est un gate purement côté
# client (détection de connectivité) : il ne correspond à aucune route ici.
#
# Persistance côté serveur : PostgreSQL, voir RT_70 (tables, compteur de
# révision par compte qui fonde `since` et `versionToken`).
#
# Hors périmètre, par décision du product owner : vérification de l'adresse
# email et récupération d'un mot de passe oublié (RG_50), connexion par un
# fournisseur tiers, expiration de la connexion, liste des appareils connectés
# et déconnexion à distance (RG_53), partage de données entre comptes
# différents. Un export des données n'est pas nécessaire : un pull complet
# (GET /sync/changes sans `since`) renvoie l'intégralité des enregistrements.
#
# Parcours inter-appareils de référence :
#   1. Appareil A : POST /auth/register (ou /auth/login) avec son `device` ;
#      il reçoit un jeton d'appareil permanent (RT_67).
#   2. GET /sync/summary ; si A a des données locales ET le compte aussi, le
#      joueur choisit fusion ou remplacement (RG_51).
#   3. GET /sync/changes (paginé, `hasMore`) puis POST /sync/changes.
#   4. Appareil B : mêmes étapes 1 à 3 — il retrouve les listes et
#      déploiements de A.
#   5. Ensuite, à chaque reprise réseau / retour au premier plan (RT_10) :
#      pull puis push ; les conflits (RG_11, RG_54) sont présentés au joueur
#      puis tranchés par POST /sync/conflicts/resolve.

info:
  title: 40K Deployment Planner — Sync API
  description: >-
    API de synchronisation par différence (delta) des listes d'armée et des
    déploiements entre les appareils d'un même joueur, et gestion du compte
    utilisateur optionnel (RG_10) : inscription, connexion permanente de
    chaque appareil, gestion et suppression du compte.


    Version 1.1.0 : jeton d'appareil permanent à la place du couple access /
    refresh token et des sessions (RG_53, RT_67), conflits entre appareils
    étendus (RG_54), bornes de toutes les données (RT_69), serveur local de
    développement (RT_71). Aucun serveur ni client n'implémentant la 1.0.0, les
    routes retirées ne sont pas conservées.
  version: 1.1.0

# RT_71 : l'adresse effective est `syncApiBaseUrl` de l'environnement de build
# du client. Production : adresse non tranchée (voir spec.md, « Suivi des
# décisions non tranchées ») — elle sera ajoutée ici une fois choisie.
servers:
  - url: http://localhost:3000/v1
    description: Développement — serveur local (RT_71).

security:
  - deviceToken: []

tags:
  - name: auth
    description: Inscription, connexion et déconnexion d'un appareil (RG_50, RG_53, RT_21, RT_67).
  - name: account
    description: Gestion du compte connecté (RG_52).
  - name: sync
    description: >-
      Synchronisation delta (RT_09, RT_68, RT_70), déclenchement (RT_10),
      première connexion d'un appareil (RG_51), conflits (RG_11, RG_54, RT_15).

paths:
  # ---------------------------------------------------------------------
  # RG_10 : le compte est optionnel — ces routes ne sont appelées que si le
  # joueur choisit explicitement de synchroniser vers un second appareil.
  # RT_21/RT_14 : le client ne les propose qu'en ligne.
  # ---------------------------------------------------------------------
  /auth/register:
    post:
      tags: [auth]
      operationId: register
      summary: Créer un compte et connecter cet appareil (RG_50, RT_67)
      description: >-
        RG_50 : email normalisé par le serveur (espaces retirés, minuscules)
        avant le contrôle d'unicité. Aucune vérification de l'adresse n'est
        faite et aucun mécanisme de récupération de mot de passe n'existe : le
        client en avertit le joueur sur le formulaire. Le compte est
        utilisable et synchronisable immédiatement. RT_67 : le jeton d'appareil
        renvoyé n'expire pas.
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Compte créé et appareil connecté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '409':
          description: Un compte existe déjà pour cet email (`EMAIL_TAKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/login:
    post:
      tags: [auth]
      operationId: login
      summary: Connecter cet appareil à un compte existant (RG_50, RG_53, RT_67)
      description: >-
        RG_50 : un email inconnu et un mot de passe erroné produisent la même
        réponse (`INVALID_CREDENTIALS`), pour ne pas révéler l'existence d'un
        compte. RT_69 : tentatives limitées par email et par adresse IP (429).
        RT_67 : si cet appareil (`device.id`) était déjà connecté au compte,
        son ancien jeton est remplacé ; les autres appareils ne sont pas
        touchés (RG_53).
      security: []
      parameters:
        - $ref: '#/components/parameters/ClientVersion'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Appareil connecté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Identifiants invalides (`INVALID_CREDENTIALS`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /auth/logout:
    post:
      tags: [auth]
      operationId: logout
      summary: Déconnecter cet appareil (RG_19, RG_53, RT_67)
      description: >-
        Supprime le jeton d'appareil présenté. Seul moyen, avec la suppression
        du compte, de mettre fin à la connexion d'un appareil (RG_53). RG_19 :
        la déconnexion ne supprime aucune donnée locale ; côté client, elle est
        effective même si cet appel échoue (RG_09).
      responses:
        '204':
          description: Appareil déconnecté.
        '401':
          $ref: '#/components/responses/Unauthorized'

  # ---------------------------------------------------------------------
  # RG_52 : gestion du compte connecté, depuis le bloc Compte des Réglages
  # (RG_18). Toute action sensible exige le mot de passe courant.
  # ---------------------------------------------------------------------
  /account:
    get:
      tags: [account]
      operationId: getAccount
      summary: Profil du compte connecté (RG_19)
      responses:
        '200':
          description: Profil courant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /auth/me:
    get:
      tags: [account]
      operationId: getMe
      deprecated: true
      summary: Alias déprécié de GET /account (contrat v0.1)
      description: >-
        Conservé pour le client actuel, encore conforme au contrat v0.1 (voir
        « Suivi des écarts » de spec.md). Même réponse que GET /account.
      responses:
        '200':
          description: Profil courant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /account/password:
    put:
      tags: [account]
      operationId: changePassword
      summary: Changer le mot de passe (RG_52)
      description: >-
        RG_52 : le mot de passe courant est exigé. Le nouveau ne sert qu'aux
        connexions suivantes : tous les appareils connectés le restent, y
        compris celui-ci (RG_53).
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '204':
          description: Mot de passe changé.
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: >-
            Mot de passe courant erroné (`INVALID_CREDENTIALS`) ou appareil
            non connecté (`UNAUTHENTICATED`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /account/email:
    put:
      tags: [account]
      operationId: changeEmail
      summary: Changer l'adresse email du compte (RG_52)
      description: >-
        RG_52 : le mot de passe courant est exigé. Comme à l'inscription
        (RG_50), la nouvelle adresse est normalisée et n'est pas vérifiée. Les
        appareils restent connectés.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangeEmailRequest'
      responses:
        '200':
          description: Profil mis à jour.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          description: Mot de passe erroné (`INVALID_CREDENTIALS`) ou appareil non connecté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '409':
          description: Adresse déjà utilisée par un autre compte (`EMAIL_TAKEN`).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /account/delete:
    post:
      tags: [account]
      operationId: deleteAccount
      summary: Supprimer immédiatement le compte et toutes ses données serveur (RG_52, RT_70)
      description: >-
        RG_52 : action confirmée explicitement par le joueur côté client, et
        mot de passe exigé ici. RT_70 : en une seule transaction, le serveur
        supprime le compte, son adresse, toutes ses listes et déploiements,
        leurs traces de suppression, ses clés d'idempotence et les jetons de
        tous ses appareils. À la réponse 204, il ne conserve plus aucune donnée
        du joueur ; rien n'est différé ni récupérable. Les données locales de
        chaque appareil sont conservées (RG_10) : l'appareil courant repasse
        immédiatement en usage local, les autres à leur prochain appel (401).
        Exposé en POST plutôt qu'en DELETE parce que le corps (mot de passe)
        d'un DELETE n'est pas garanti par tous les intermédiaires HTTP.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DeleteAccountRequest'
      responses:
        '204':
          description: Compte et données supprimés.
        '401':
          description: Mot de passe erroné (`INVALID_CREDENTIALS`) ou appareil non connecté.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  # ---------------------------------------------------------------------
  # RT_09/RT_68/RT_70 : synchronisation delta des enregistrements créés /
  # modifiés / supprimés depuis la dernière révision connue de l'appareil.
  # RT_10 : déclenchée par le client à la reprise réseau et/ou au retour au
  # premier plan — jamais bloquante (voir RG_09), donc toujours asynchrone
  # du point de vue de l'UI qui l'appelle.
  # EX_06 : couvre à la fois les listes importées et les déploiements, pour
  # qu'un second appareil retrouve "ses listes et déploiements".
  # ---------------------------------------------------------------------
  /sync/summary:
    get:
      tags: [sync]
      operationId: getSyncSummary
      summary: Résumé du contenu du compte, pour la première connexion d'un appareil (RG_51)
      description: >-
        RG_51 : appelé juste après login/register, avant toute synchronisation.
        Si l'appareil a des données locales et que le compte n'est pas vide,
        le client demande au joueur de fusionner ou de remplacer ; sinon il
        synchronise directement.
      parameters:
        - $ref: '#/components/parameters/ClientVersion'
      responses:
        '200':
          description: Comptes d'enregistrements actifs (hors suppressions).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /sync/changes:
    get:
      tags: [sync]
      operationId: pullChanges
      summary: Récupérer les changements serveur depuis une révision (RT_09, RT_68, RT_70)
      description: >-
        RT_70 : renvoie, par révision croissante, les enregistrements du compte
        dont la révision dépasse `since`. RT_68 : réponse paginée. Tant que
        `hasMore` est vrai, le client rappelle immédiatement avec
        `since = nextToken`, et ne mémorise `nextToken` comme révision de
        l'appareil (RT_15) qu'une fois la page appliquée localement — une
        interruption reprend donc là où elle s'est arrêtée. Un enregistrement
        modifié plusieurs fois n'apparaît qu'une fois, dans son dernier état.
      parameters:
        - $ref: '#/components/parameters/ClientVersion'
        - name: since
          in: query
          description: >-
            Révision de l'appareil (RT_70), renvoyée par le dernier pull
            réussi. Omise (ou vide) lors de la toute première synchronisation
            d'un appareil (RG_51), ou après un 410 : le serveur renvoie alors
            l'intégralité des enregistrements actifs du compte, sans
            suppressions.
          schema:
            type: string
            pattern: '^\d*$'
            maxLength: 20
        - name: limit
          in: query
          description: Nombre maximal d'enregistrements (listes + déploiements + suppressions) par page.
          schema:
            type: integer
            minimum: 1
            maximum: 500
            default: 200
      responses:
        '200':
          description: Une page du delta des enregistrements modifiés côté serveur depuis `since`.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPullResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '410':
          description: >-
            `SYNC_TOKEN_EXPIRED` — `since` est inférieur à la plus haute
            révision de suppression purgée (traces conservées 90 jours, RT_70).
            Le client refait un pull complet sans `since`, puis supprime
            localement les enregistrements synchronisés absents de ce pull qui
            ne sont pas modifiés localement ; ses modifications locales en
            attente ne sont jamais perdues et partent au push suivant.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

    post:
      tags: [sync]
      operationId: pushChanges
      summary: Pousser les changements locaux (RT_09, RT_68)
      description: >-
        RT_68 : chaque enregistrement porte son `versionToken` de base —
        celui reçu à sa dernière synchronisation (RT_15), absent pour une
        création. Le serveur traite, dans une transaction qui verrouille le
        compte (RT_70), d'abord les listes écrites, puis les déploiements
        écrits, puis les suppressions de déploiements, puis les suppressions
        de listes. Chaque enregistrement est indépendamment :

        - accepté : écrit, renvoyé dans `accepted` avec sa nouvelle révision ;

        - en conflit (RG_54) : rien n'est écrit, renvoyé dans `conflicts` —
          jeton de base périmé, enregistrement supprimé sur le serveur, liste
          supprimée alors que le serveur a des déploiements de cette liste que
          la poussée ne supprime pas ou qui ont changé, déploiement dont la
          liste a été supprimée sur le serveur, ou création d'un déploiement
          alors que le serveur porte, pour le même triplet (liste, disposition
          adverse, plateau), un déploiement de révision supérieure à `since` ;

        - rejeté : non conforme au schéma ou à ses bornes (RT_69), renvoyé
          dans `rejected`.

        Un conflit ou un rejet ne bloque jamais l'acceptation des autres
        enregistrements. RG_21 : une suppression de liste acceptée supprime
        ses déploiements restants ; ils reviennent au pull suivant dans
        `deletedDeploymentIds`. Requête idempotente par `Idempotency-Key` :
        rejouée après une réponse perdue, elle renvoie la réponse initiale au
        lieu de produire des conflits contre ses propres écritures.
      parameters:
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SyncPushRequest'
      responses:
        '200':
          description: Résultat par enregistrement (accepté / en conflit / rejeté).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SyncPushResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '413':
          description: >-
            `BATCH_TOO_LARGE` — plus de 200 enregistrements (listes,
            déploiements et suppressions confondus) ou corps de plus de 5 Mo.
            Le client découpe sa poussée en plusieurs requêtes, une liste et
            ses déploiements restant dans la même (RT_68).
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '422':
          description: >-
            `IDEMPOTENCY_KEY_REUSED` — la clé a déjà servi pour un corps
            différent.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

  /sync/conflicts/resolve:
    post:
      tags: [sync]
      operationId: resolveConflict
      summary: Appliquer le choix du joueur sur un conflit (RG_11, RG_54, RT_68)
      description: >-
        Le joueur a comparé les deux versions — date, heure et appareil de
        chacune — et désigné celle qui prime (RG_54) ; ce choix écrase l'autre
        version pour cet enregistrement et ceux qui lui sont liés :

        - `keepLocal` : la version locale est écrite ; pour un déploiement
          dont la liste a été supprimée sur le serveur, `localList` est
          restaurée avec lui ; pour un déploiement en double (même triplet),
          le déploiement serveur est supprimé ; pour une suppression locale de
          liste, la liste et tous ses déploiements serveur sont supprimés ;

        - `keepServer` : rien n'est écrit ; la version serveur et les
          enregistrements liés sont renvoyés pour être appliqués localement.

        `serverVersionToken` est le jeton de la version serveur présentée au
        joueur : si le serveur a changé depuis, la résolution est refusée
        (409) plutôt que d'écraser une version que le joueur n'a pas vue.
      parameters:
        - $ref: '#/components/parameters/ClientVersion'
        - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConflictResolution'
      responses:
        '200':
          description: Conflit résolu ; changements à appliquer localement.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConflictResolutionResult'
        '400':
          $ref: '#/components/responses/ValidationError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          description: >-
            `CONFLICT_STALE` — l'enregistrement, ou un enregistrement lié, a de
            nouveau changé côté serveur entre la détection du conflit et cette
            résolution ; le client relance /sync/changes, puis présente à
            nouveau le conflit.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
        '426':
          $ref: '#/components/responses/UpgradeRequired'
        '429':
          $ref: '#/components/responses/TooManyRequests'

components:
  securitySchemes:
    deviceToken:
      type: http
      scheme: bearer
      description: >-
        RT_67 : jeton d'appareil opaque (256 bits, encodé en base64url), obtenu
        par /auth/register ou /auth/login, transmis en
        `Authorization: Bearer <jeton>`. Il n'expire pas et n'est jamais
        renouvelé (RG_53) ; il prend fin à la déconnexion de l'appareil
        (/auth/logout) ou à la suppression du compte. Stocké haché par le
        serveur ; ne doit jamais figurer dans une URL ni dans un journal.

  parameters:
    ClientVersion:
      name: X-Client-Version
      in: header
      required: false
      description: >-
        RT_69/RG_47 : version de l'application (`MAJEUR.MINEUR.CORRECTIF`,
        `version` de package.json). Permet au serveur de refuser (426) un
        client trop ancien pour le schéma qu'il sert. Absente : le client est
        tenu pour compatible.
      schema:
        type: string
        pattern: '^\d+\.\d+\.\d+$'
        maxLength: 32
        example: 0.0.5
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: >-
        RT_68 : identifiant unique (UUID) généré par le client pour une
        tentative logique ; réutilisé tel quel en cas de nouvelle tentative
        après une erreur réseau. Le serveur conserve la réponse 24 heures
        (RT_70).
      schema:
        type: string
        format: uuid

  responses:
    ValidationError:
      description: >-
        `VALIDATION_FAILED` — corps ou paramètres non conformes au schéma ;
        `details` liste les champs fautifs.
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    Unauthorized:
      description: >-
        `UNAUTHENTICATED` — jeton d'appareil absent ou inconnu : l'appareil a
        été déconnecté ou le compte supprimé (RG_53). Le client repasse en
        usage local, sans perte de données (RG_10).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    TooManyRequests:
      description: >-
        `RATE_LIMITED` — RT_69 : seuil de requêtes dépassé. Le client attend
        au moins `Retry-After` secondes avant de retenter, sans bloquer le
        joueur (RG_09).
      headers:
        Retry-After:
          description: Délai d'attente en secondes.
          schema:
            type: integer
            minimum: 1
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'
    UpgradeRequired:
      description: >-
        `CLIENT_TOO_OLD` — RT_69 : la version de l'application (en-tête
        `X-Client-Version`) ne peut plus synchroniser avec ce serveur. Le
        client suspend la synchronisation, garde ses données locales et
        invite le joueur à mettre l'application à jour (RG_19).
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/Error'

  # Note d'implémentation : le client conserve, en plus des champs décrits
  # ici, un indicateur local « modifié depuis le dernier sync réussi »
  # (RT_15). C'est un état d'appareil, pas une donnée partagée : il n'est
  # jamais transmis et n'apparaît donc dans aucun schéma ci-dessous.
  #
  # RT_69 : toutes les bornes (maxLength, maxItems, minimum, maximum) sont
  # contrôlées par le serveur ; un enregistrement hors bornes est rejeté
  # (`rejected`, INVALID_RECORD), une requête hors bornes reçoit 400.
  schemas:
    # RT_69 : un corps d'erreur unique pour toutes les routes ; le client
    # décide sur `code`, jamais sur `message` (destiné à l'affichage).
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
        message:
          type: string
          maxLength: 500
          description: Message lisible, en français, affichable tel quel au joueur.
        details:
          type: array
          maxItems: 50
          description: Pour `VALIDATION_FAILED` — un élément par champ fautif.
          items:
            type: object
            required: [field, message]
            properties:
              field:
                type: string
                description: Chemin du champ, ex. `password` ou `deployments[3].listId`.
              message:
                type: string

    ErrorCode:
      type: string
      enum:
        - VALIDATION_FAILED
        - INVALID_CREDENTIALS
        - EMAIL_TAKEN
        - UNAUTHENTICATED
        - RATE_LIMITED
        - BATCH_TOO_LARGE
        - SYNC_TOKEN_EXPIRED
        - CONFLICT_STALE
        - IDEMPOTENCY_KEY_REUSED
        - CLIENT_TOO_OLD
        - INTERNAL_ERROR

    # RT_69 : bornes communes des identifiants.
    RecordId:
      type: string
      minLength: 1
      maxLength: 100
      description: >-
        Identifiant généré par le client (RT_07), ex. `list_<uuid>`. Portée
        d'unicité supposée : par compte (RT_70, décision à confirmer).

    ReferentialId:
      type: string
      minLength: 1
      maxLength: 100
      description: >-
        Identifiant d'un référentiel embarqué dans le client (RT_02, RT_12,
        RT_23). Le serveur ne vérifie pas son existence (RT_69).

    # RG_50 : règles de saisie communes à l'inscription et au changement.
    Email:
      type: string
      format: email
      maxLength: 254
      description: Normalisé par le serveur (espaces retirés, minuscules) ; jamais vérifié (RG_50).

    Password:
      type: string
      format: password
      minLength: 8
      maxLength: 128
      description: RG_50 — 8 à 128 caractères, aucune autre contrainte de composition.

    # RT_67 : identité de l'appareil, générée une fois par le client et
    # conservée dans sa configuration légère (RT_08).
    Device:
      type: object
      required: [id, name, platform]
      properties:
        id:
          type: string
          format: uuid
          description: Identifiant stable de l'installation de l'application sur cet appareil.
        name:
          type: string
          minLength: 1
          maxLength: 80
          description: >-
            Libellé de l'appareil, ex. « Chrome — Windows ». Affiché au joueur
            dans les conflits comme auteur d'une version (RG_54).
        platform:
          type: string
          enum: [android, ios, web]
          description: >-
            `android` : application empaquetée ; `ios`/`web` : version web,
            installée (EX_12) ou dans un onglet.

    # RG_54 : auteur d'une version, tel que présenté au joueur.
    DeviceLabel:
      type: object
      required: [id, name, platform]
      properties:
        id:
          type: string
          format: uuid
          description: Permet au client de reconnaître ses propres écritures (« Cet appareil »).
        name:
          type: string
          maxLength: 80
        platform:
          type: string
          enum: [android, ios, web]

    RegisterRequest:
      type: object
      required: [email, password, device]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          $ref: '#/components/schemas/Password'
        device:
          $ref: '#/components/schemas/Device'

    LoginRequest:
      type: object
      required: [email, password, device]
      properties:
        email:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          maxLength: 128
        device:
          $ref: '#/components/schemas/Device'

    ChangePasswordRequest:
      type: object
      required: [currentPassword, newPassword]
      properties:
        currentPassword:
          type: string
          format: password
          maxLength: 128
        newPassword:
          $ref: '#/components/schemas/Password'

    ChangeEmailRequest:
      type: object
      required: [newEmail, password]
      properties:
        newEmail:
          $ref: '#/components/schemas/Email'
        password:
          type: string
          format: password
          maxLength: 128

    DeleteAccountRequest:
      type: object
      required: [password]
      properties:
        password:
          type: string
          format: password
          maxLength: 128

    User:
      type: object
      required: [id, email, createdAt]
      properties:
        id:
          type: string
          format: uuid
          description: >-
            Identifiant stable du compte. RG_51 : le client le compare à celui
            du dernier compte synchronisé sur l'appareil pour détecter un
            changement de compte.
        email:
          $ref: '#/components/schemas/Email'
        createdAt:
          type: string
          format: date-time

    # RT_67 : résultat d'une inscription ou d'une connexion.
    AuthResult:
      type: object
      required: [deviceToken, user]
      properties:
        deviceToken:
          type: string
          maxLength: 64
          description: >-
            Jeton d'appareil permanent (RT_67), à conserver dans la
            configuration légère (RT_08) et à joindre à chaque appel. Il n'est
            renvoyé qu'ici : le serveur n'en garde que le hash.
        user:
          $ref: '#/components/schemas/User'

    # RG_04/RT_04 : un placement = un modèle, jamais une unité entière.
    # Champs identiques à RT_04 pour une traçabilité directe.
    Placement:
      type: object
      required: [idUnite, idModele, x, y, rotation]
      properties:
        idUnite:
          $ref: '#/components/schemas/RecordId'
        idModele:
          type: string
          minLength: 1
          maxLength: 150
          description: >-
            Identité d'un modèle précis au sein de l'unité, de la forme
            `<idGroupeDeModeles>#<rang>` (RT_18 : le groupe porte le socle du
            modèle, ce qui permet de recouper un placement avec sa forme).
        x:
          type: number
          minimum: 0
          maximum: 10000
          description: Pixels d'asset du plateau (RT_04/RT_05).
        y:
          type: number
          minimum: 0
          maximum: 10000
          description: Pixels d'asset du plateau (RT_04/RT_05).
        rotation:
          type: number
          minimum: -3600
          maximum: 3600
          description: Degrés.

    # RG_02/RG_16/RT_18 : un groupe de modèles d'une unité partageant le même
    # socle. Une unité n'a pas forcément un socle unique — RG_16 affiche
    # justement ses socles « regroupés par forme/taille avec un compte » —
    # d'où ce niveau intermédiaire plutôt qu'un `baseShapeId` par unité.
    UnitModelGroup:
      type: object
      required: [id, name, count]
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        name:
          type: string
          maxLength: 200
          description: Nom du profil de modèle tel qu'importé (RT_13).
        count:
          type: integer
          minimum: 1
          maximum: 500
        baseShapeId:
          type: string
          maxLength: 100
          description: >-
            Référence dans le référentiel de socles embarqué (RT_02).
            `null` tant que le joueur ne l'a pas assigné à la main (RG_02).
            Mutuellement exclusif avec `customRectangleMm` (RT_28).
          nullable: true
        customRectangleMm:
          type: object
          description: >-
            RG_02/RT_28 : socle rectangulaire sur mesure, saisi à la main par
            le joueur en dernier recours (mesuré sur le modèle physique).
            Propre à ce groupe de cette liste, jamais reversé au référentiel
            partagé (RT_26). Mutuellement exclusif avec `baseShapeId`.
          required: [widthMm, lengthMm]
          properties:
            widthMm:
              type: number
              minimum: 0
              exclusiveMinimum: true
              maximum: 1000
            lengthMm:
              type: number
              minimum: 0
              exclusiveMinimum: true
              maximum: 1000

    # RG_02/RT_13 : unité importée, résolue vers un ou plusieurs socles via le
    # référentiel RT_02 (le référentiel lui-même reste embarqué, non exposé
    # par l'API).
    ArmyUnit:
      type: object
      required: [id, name, modelCount, modelGroups]
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        name:
          type: string
          maxLength: 200
        modelCount:
          type: integer
          minimum: 1
          maximum: 500
          description: Somme des `count` de `modelGroups` (RT_13).
        modelGroups:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/UnitModelGroup'
        color:
          type: string
          pattern: '^#[0-9A-Fa-f]{6}$'
          description: Couleur assignée à l'unité (RG_06), `#RRGGBB`.
        attachment:
          $ref: '#/components/schemas/UnitAttachment'

    # RG_36/RT_45 : attachement d'un personnage à l'unité qu'il escorte. Porté
    # par le seul personnage ; absent pour une unité indépendante. Un client
    # ignore sans erreur un attachement qui ne respecte plus les contraintes
    # structurelles de RG_36 (lecture tolérante, RT_45).
    UnitAttachment:
      type: object
      required: [bodyguardUnitId, role]
      properties:
        bodyguardUnitId:
          $ref: '#/components/schemas/RecordId'
        role:
          type: string
          enum: [leader, support]
          description: Meneur (leader) ou soutien (support).

    # RG_01/RG_02/RT_07/RT_13 : liste d'armée importée. Sert d'ancre stable
    # (`id`) pour la liaison déploiement -> liste (RT_07), synchronisée pour
    # être retrouvée sur un second appareil (EX_06).
    ArmyList:
      type: object
      required: [id, name, forceDispositionId, units, updatedAt]
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        name:
          type: string
          maxLength: 200
          description: Reprend `roster.name` à l'import (RT_13).
        forceDispositionId:
          $ref: '#/components/schemas/ReferentialId'
        units:
          type: array
          maxItems: 300
          items:
            $ref: '#/components/schemas/ArmyUnit'
        importedAt:
          type: string
          format: date-time
          description: Date de l'import initial, conservée d'un appareil à l'autre.
        updatedAt:
          $ref: '#/components/schemas/ClientTimestamp'
        versionToken:
          $ref: '#/components/schemas/VersionToken'

    # RG_07/RT_04 : un déploiement sauvegardé — nom, liaison à la liste,
    # plateau/disposition adverse retenus, l'ensemble des placements, les
    # unités mises en réserve (RG_25/RT_35) et la note de plan de jeu (RG_45/RT_60).
    Deployment:
      type: object
      required:
        - id
        - name
        - listId
        - opponentDispositionId
        - boardId
        - placements
        - reservedUnitIds
        - note
        - updatedAt
      properties:
        id:
          $ref: '#/components/schemas/RecordId'
        name:
          type: string
          maxLength: 200
        listId:
          $ref: '#/components/schemas/RecordId'
        opponentDispositionId:
          $ref: '#/components/schemas/ReferentialId'
        boardId:
          $ref: '#/components/schemas/ReferentialId'
        placements:
          type: array
          maxItems: 2000
          items:
            $ref: '#/components/schemas/Placement'
        reservedUnitIds:
          type: array
          maxItems: 300
          description: >-
            RG_25/RT_35 : identifiants des unités déclarées en réserve sur ce
            déploiement — comptées comme déployées (RG_05) sans aucun placement
            associé. Tableau vide si aucune unité n'est en réserve.
          items:
            $ref: '#/components/schemas/RecordId'
        note:
          type: string
          maxLength: 4000
          description: >-
            RG_45/RT_60 : note de plan de jeu, texte brut, chaîne vide quand il
            n'y en a pas. Conservée par « Nouveau » (RG_14). Un enregistrement
            reçu sans ce champ (client antérieur) est lu comme une chaîne vide.
        createdAt:
          $ref: '#/components/schemas/ClientTimestamp'
        updatedAt:
          $ref: '#/components/schemas/ClientTimestamp'
        versionToken:
          $ref: '#/components/schemas/VersionToken'

    # RT_68 : l'heure de la modification, fixée par l'appareil.
    ClientTimestamp:
      type: string
      format: date-time
      description: >-
        RT_68/RG_54 : fixé par l'appareil au moment où le joueur fait la
        modification, conservé tel quel par le serveur. Affiché au joueur dans
        les conflits, jamais comparé pour décider de quoi que ce soit.

    # RT_70 : révision d'un enregistrement, en chaîne.
    VersionToken:
      type: string
      nullable: true
      pattern: '^\d+$'
      maxLength: 20
      description: >-
        RT_15/RT_68/RT_70 : révision de la dernière écriture de
        l'enregistrement (compteur du compte, en chaîne). Toujours présent dans
        les réponses du serveur. Dans une poussée, jeton de base — celui reçu à
        la dernière synchronisation de cet enregistrement — absent ou `null`
        pour un enregistrement jamais synchronisé (création). Le client le
        traite comme opaque et ne le compare que par égalité.

    ResourceType:
      type: string
      enum: [list, deployment]

    # RG_51 : contenu du compte, présenté au joueur avant fusion/remplacement.
    SyncSummary:
      type: object
      required: [listCount, deploymentCount, lastChangeAt]
      properties:
        listCount:
          type: integer
          minimum: 0
        deploymentCount:
          type: integer
          minimum: 0
        lastChangeAt:
          type: string
          format: date-time
          nullable: true
          description: Dernière écriture sur le compte, depuis n'importe quel appareil ; `null` si le compte est vide.

    SyncPullResult:
      type: object
      required: [lists, deployments, deletedListIds, deletedDeploymentIds, nextToken, hasMore]
      properties:
        lists:
          type: array
          description: Listes créées ou modifiées, chacune avec son `versionToken` courant.
          items:
            $ref: '#/components/schemas/ArmyList'
        deployments:
          type: array
          description: Déploiements créés ou modifiés, chacun avec son `versionToken` courant.
          items:
            $ref: '#/components/schemas/Deployment'
        deletedListIds:
          type: array
          description: >-
            RT_68 : le client ne supprime pas localement une liste dont un
            déploiement est modifié localement — la poussée suivante produira
            le conflit « liste supprimée, déploiement modifié » (RG_54).
          items:
            $ref: '#/components/schemas/RecordId'
        deletedDeploymentIds:
          type: array
          description: Inclut les déploiements supprimés en cascade avec leur liste (RG_21).
          items:
            $ref: '#/components/schemas/RecordId'
        nextToken:
          type: string
          pattern: '^\d+$'
          description: >-
            Révision du dernier changement de cette page (RT_70), à conserver
            localement (RT_15) une fois la page appliquée, et à passer en
            `since` à l'appel suivant.
        hasMore:
          type: boolean
          description: RT_68 — vrai s'il reste des changements ; le client rappelle aussitôt avec `nextToken`.

    # RT_68 : une suppression locale porte, comme une modification, le jeton
    # de la version qu'elle supprime — un enregistrement modifié ailleurs
    # entre-temps produit un conflit au lieu d'être perdu.
    Deletion:
      type: object
      required: [resourceType, id]
      properties:
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        id:
          $ref: '#/components/schemas/RecordId'
        versionToken:
          $ref: '#/components/schemas/VersionToken'
        deletedAt:
          $ref: '#/components/schemas/ClientTimestamp'

    SyncPushRequest:
      type: object
      required: [since]
      properties:
        since:
          type: string
          pattern: '^\d*$'
          maxLength: 20
          description: >-
            Révision de l'appareil (dernier `nextToken` appliqué, chaîne vide
            s'il n'a jamais rien reçu). Sert uniquement à reconnaître un
            déploiement du même triplet que l'appareil n'a pas encore vu
            (RG_54, « même plateau créé deux fois »).
        lists:
          type: array
          maxItems: 200
          description: >-
            Listes créées ou modifiées localement, chacune avec son
            `versionToken` de base (absent pour une création).
          items:
            $ref: '#/components/schemas/ArmyList'
        deployments:
          type: array
          maxItems: 200
          description: Idem pour les déploiements.
          items:
            $ref: '#/components/schemas/Deployment'
        deletions:
          type: array
          maxItems: 200
          description: >-
            RG_08/RG_21 — suppressions confirmées explicitement par le joueur.
            Une suppression de liste est accompagnée de celle de chacun de ses
            déploiements connus de l'appareil (RT_68).
          items:
            $ref: '#/components/schemas/Deletion'

    AcceptedRecord:
      type: object
      required: [resourceType, id, deleted]
      properties:
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        id:
          $ref: '#/components/schemas/RecordId'
        deleted:
          type: boolean
          description: Vrai pour une suppression acceptée.
        versionToken:
          type: string
          pattern: '^\d+$'
          description: >-
            Nouvelle révision de l'enregistrement, que le client conserve comme
            jeton de base (RT_15). Absent quand `deleted` est vrai.

    RejectedRecord:
      type: object
      required: [resourceType, id, code, message]
      properties:
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        id:
          type: string
          maxLength: 200
          description: Identifiant tel que reçu (éventuellement hors bornes).
        code:
          type: string
          enum: [INVALID_RECORD, UNKNOWN_LIST, LIST_MISMATCH]
          description: >-
            `INVALID_RECORD` : enregistrement non conforme à son schéma ou à
            ses bornes (RT_69). `UNKNOWN_LIST` : déploiement dont la `listId`
            n'a jamais existé sur le compte ni dans la requête (une liste
            supprimée produit un conflit, pas un rejet). `LIST_MISMATCH` :
            déploiement existant dont la `listId` changerait — la liaison est
            immuable (RT_07).
        message:
          type: string
          description: >-
            Le client conserve l'enregistrement localement (jamais supprimé
            pour un rejet) et le signale dans l'état de synchronisation (RG_19).

    # RG_11/RG_54/RT_68 : un enregistrement en conflit n'est jamais écrasé
    # automatiquement — la version serveur est renvoyée telle quelle, avec sa
    # date et son appareil, pour être présentée au joueur à côté de la
    # version locale qu'il a soumise.
    Conflict:
      type: object
      required: [resourceType, id, kind, serverRecord, serverVersionToken, serverUpdatedAt, serverDevice]
      properties:
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        id:
          $ref: '#/components/schemas/RecordId'
        kind:
          type: string
          enum:
            - bothModified
            - deletedOnServer
            - deletedLocally
            - listDeletedOnServer
            - listDeletedLocally
            - duplicateDeployment
          description: >-
            RG_54. `bothModified` : modifié des deux côtés.
            `deletedOnServer` : modifié ici, supprimé par un autre appareil.
            `deletedLocally` : supprimé ici, modifié par un autre appareil.
            `listDeletedOnServer` (déploiement) : déploiement créé ou modifié
            ici alors que sa liste a été supprimée par un autre appareil.
            `listDeletedLocally` (liste) : liste supprimée ici alors qu'un
            autre appareil a créé ou modifié des déploiements de cette liste,
            listés dans `relatedServerRecords`. `duplicateDeployment`
            (déploiement) : déploiement créé ici pour un triplet (liste,
            disposition adverse, plateau) dont un autre appareil a créé un
            déploiement que celui-ci n'avait pas vu — `serverRecord` est ce
            dernier, avec son propre identifiant.
        serverRecord:
          type: object
          nullable: true
          description: >-
            Version serveur (ArmyList ou Deployment selon `resourceType`) ;
            `null` quand elle est une suppression (`deletedOnServer`,
            `listDeletedOnServer`).
          oneOf:
            - $ref: '#/components/schemas/ArmyList'
            - $ref: '#/components/schemas/Deployment'
        serverVersionToken:
          type: string
          pattern: '^\d+$'
          description: Révision de la version serveur présentée, à renvoyer à la résolution.
        serverUpdatedAt:
          type: string
          format: date-time
          description: >-
            RG_54 — date et heure de la version serveur : son `updatedAt`, ou
            la date de sa suppression. Affichée, jamais comparée.
        serverDevice:
          $ref: '#/components/schemas/DeviceLabel'
        relatedServerRecords:
          type: array
          description: >-
            `listDeletedLocally` : déploiements serveur de la liste qui seraient
            supprimés avec elle. Absent sinon.
          items:
            $ref: '#/components/schemas/Deployment'

    SyncPushResult:
      type: object
      required: [accepted, conflicts, rejected]
      description: >-
        RT_68 : la poussée ne renvoie pas de révision d'appareil. Seul le pull
        fait avancer `since` : une révision renvoyée ici sauterait les
        écritures d'autres appareils survenues entre le pull et le push. Le
        pull suivant renvoie donc aussi les propres écritures acceptées de
        l'appareil ; le client les reconnaît à leur `versionToken`, identique à
        celui reçu dans `accepted`, et n'a rien à y appliquer.
      properties:
        accepted:
          type: array
          items:
            $ref: '#/components/schemas/AcceptedRecord'
        conflicts:
          type: array
          items:
            $ref: '#/components/schemas/Conflict'
        rejected:
          type: array
          items:
            $ref: '#/components/schemas/RejectedRecord'

    ConflictResolution:
      type: object
      required: [resourceType, id, kind, resolution, serverVersionToken]
      description: >-
        `localList` : requis pour `listDeletedOnServer` + keepLocal — la liste
        locale, restaurée sur le serveur avec le déploiement.
        `duplicateServerDeploymentId` : requis pour `duplicateDeployment` —
        l'identifiant du déploiement serveur (`Conflict.serverRecord.id`), que
        keepLocal supprime.
      properties:
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        id:
          $ref: '#/components/schemas/RecordId'
        kind:
          type: string
          enum:
            - bothModified
            - deletedOnServer
            - deletedLocally
            - listDeletedOnServer
            - listDeletedLocally
            - duplicateDeployment
          description: Nature du conflit, reprise de `Conflict.kind`.
        resolution:
          type: string
          enum: [keepLocal, keepServer]
          description: >-
            RG_54 — version désignée par le joueur. keepLocal : la version de
            cet appareil prime. keepServer : celle de l'autre appareil prime.
        serverVersionToken:
          type: string
          pattern: '^\d+$'
          description: Révision reçue dans `Conflict.serverVersionToken` ; refusée (409) si elle n'est plus courante.
        localRecord:
          description: >-
            Requis quand resolution = keepLocal, sauf pour une suppression
            locale (`deletedLocally`, `listDeletedLocally`). Absent sinon.
          oneOf:
            - $ref: '#/components/schemas/ArmyList'
            - $ref: '#/components/schemas/Deployment'
        localList:
          $ref: '#/components/schemas/ArmyList'
        duplicateServerDeploymentId:
          $ref: '#/components/schemas/RecordId'

    ConflictResolutionResult:
      type: object
      required: [resourceType, id, deleted, relatedRecords, relatedDeletions]
      description: >-
        Changements que le client applique localement, puis marque
        synchronisés.
      properties:
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        id:
          $ref: '#/components/schemas/RecordId'
        deleted:
          type: boolean
          description: >-
            Vrai si la version retenue est une suppression : le client
            supprime alors l'enregistrement localement (et, pour une liste,
            ses déploiements, RG_21).
        record:
          description: Version retenue ; absente quand `deleted` est vrai.
          oneOf:
            - $ref: '#/components/schemas/ArmyList'
            - $ref: '#/components/schemas/Deployment'
        versionToken:
          type: string
          pattern: '^\d+$'
          description: Révision de la version retenue ; absente quand `deleted` est vrai.
        relatedRecords:
          type: array
          description: >-
            Enregistrements liés à écrire localement : la liste restaurée
            (`listDeletedOnServer` + keepLocal), ou les déploiements serveur
            d'une liste dont la suppression est abandonnée
            (`listDeletedLocally` + keepServer). Tableau vide sinon.
          items:
            $ref: '#/components/schemas/RelatedRecord'
        relatedDeletions:
          type: array
          description: >-
            Enregistrements liés à supprimer localement : le déploiement local
            écarté (`duplicateDeployment` + keepServer), les déploiements
            locaux d'une liste supprimée (`listDeletedOnServer` + keepServer).
            Tableau vide sinon.
          items:
            type: object
            required: [resourceType, id]
            properties:
              resourceType:
                $ref: '#/components/schemas/ResourceType'
              id:
                $ref: '#/components/schemas/RecordId'

    RelatedRecord:
      type: object
      required: [resourceType, record, versionToken]
      properties:
        resourceType:
          $ref: '#/components/schemas/ResourceType'
        record:
          oneOf:
            - $ref: '#/components/schemas/ArmyList'
            - $ref: '#/components/schemas/Deployment'
        versionToken:
          type: string
          pattern: '^\d+$'
